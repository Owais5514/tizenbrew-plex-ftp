<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TizenFlix — AniList Relay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #181d26; border: 1px solid #2a3342; border-radius: 20px; max-width: 420px; width: 100%; padding: 32px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .brand { font-size: 26px; font-weight: 900; margin-bottom: 20px; letter-spacing: 1px; }
    .brand-tizen { color: #fff; }
    .brand-flix { color: #e50914; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #02a9ff; border-radius: 50%; width: 44px; height: 44px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 20px; margin-bottom: 8px; }
    p { color: #9aa4b2; font-size: 14px; line-height: 1.5; }
    .error { color: #ef4444; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-tizen">TIZEN</span><span class="brand-flix">FLIX</span>
    </div>
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Relaying to your TV...</h2>
    <p id="msg">Capturing AniList authorization and synchronizing your screen.</p>
  </div>

  <script>
    try {
      const hash = window.location.hash ? window.location.hash.substring(1) : '';
      const params = new URLSearchParams(hash);
      const token = params.get('access_token');
      const stateRaw = params.get('state');

      if (!token) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'No Token Received';
        document.getElementById('msg').innerHTML = '<span class="error">AniList did not return an access token. Please retry authorization.</span>';
      } else if (stateRaw) {
        let state = {};
        try { state = JSON.parse(decodeURIComponent(stateRaw)); } catch (_) {}
        if (state.ip) {
          const port = state.port || 8999;
          const sid = state.sid || '';
          window.location.href = `http://${state.ip}:${port}/auth/anilist?token=${token}&sid=${sid}`;
        } else {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('title').textContent = 'Relay Error';
          document.getElementById('msg').innerHTML = '<span class="error">Target TV IP address was not specified in the authentication state.</span>';
        }
      } else {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Token Ready';
        document.getElementById('msg').textContent = 'Access token captured. Please return to your TizenFlix app.';
      }
    } catch (err) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Relay Failed';
      document.getElementById('msg').innerHTML = '<span class="error">' + err.message + '</span>';
    }
  </script>
</body>
</html>
